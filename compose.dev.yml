# Desarrollo local vía Docker. Ver README.md § Desarrollo.
#
# db  → Postgres con las extensiones, roles y schema `auth` de Supabase (misma imagen que producción).
# cli → Supabase CLI + psql + pg_prove, con el repo montado en /work.
#
# La base NO persiste entre `down`: cada arranque parte de cero y aplica las migraciones,
# que es exactamente lo que valida CI.
services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.141
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      # Expuesto solo para clientes GUI del host. 54322 suele estar tomado por `supabase start`
      # de otros proyectos; se puede cambiar con DB_PORT=xxxxx.
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 30

  cli:
    build:
      context: .
      dockerfile: dockerfile.dev
    volumes:
      - .:/work
    working_dir: /work
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      # sslmode=disable: el CLI de Supabase exige TLS en --db-url y la base local no lo tiene.
      DB_URL: postgresql://postgres:postgres@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
