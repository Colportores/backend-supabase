name: CI

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas del publicador de mapas (tiles/, backend-supabase#42): catálogo, estilo, política de
  # tamaño, subida a Storage y verificación, todo contra un Storage de mentira. No necesita Docker
  # ni credenciales. El bucket en sí no se prueba acá: lo prueba el job `storage` (de abajo) contra un
  # storage-api real, y `node src/cli.mjs verificar` después de cada publicación (workflow Mapas).
  tiles:
    name: tiles · pruebas del publicador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiles/package-lock.json
      - run: npm ci
      - run: npm test

  # Un solo pull por run (y casi nunca): deja en la caché de Actions las imágenes que bajan `migraciones` y
  # `storage` (scripts/ci-imagenes.txt) y los dos jobs las restauran de ahí con `docker load`, sin tocar
  # ghcr.io. Con la caché ya hecha (la clave lleva el hash de la tabla y el mes) este job solo la comprueba, sin
  # descargarla. Sin caché, baja por digest de ghcr.io y, si ghcr.io contesta `toomanyrequests` (que el 26/10 duró
  # horas), de ECR Public y de Docker Hub. Si aun así ningún registro contesta, el run falla acá, una vez,
  # en vez de en dos jobs a la vez.
  imagenes:
    name: imágenes · caché y registros de respaldo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Sin Docker: que la tabla de imágenes coincida con compose.dev.yml y correr.sh.
      - name: Tabla de imágenes al día
        run: bash scripts/check-ci-imagenes.sh

      - name: Imágenes de la base
        uses: ./.github/actions/imagenes
        with:
          grupo: base
          solo-comprobar: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Imágenes de Storage
        uses: ./.github/actions/imagenes
        with:
          grupo: storage
          solo-comprobar: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # El bucket `mapas` contra un Storage de verdad (backend-supabase#75). La base del job `migraciones` no
  # trae el servicio Storage (el schema `storage` está vacío): ahí la migración 0029 y pgTAP 0036 se
  # saltean. Este job levanta el storage-api oficial (imagen de ghcr.io, sin credenciales), aplica las
  # migraciones y corre los pgTAP que dependen de Storage (hoy la 0036): es la parte de base de
  # `tiles/prueba-storage/correr.sh` (`SOLO_BASE=1`: se detiene después de pgTAP, sin red, sin recorte y sin
  # cargar ciudades). FALLA si la 0029 no creó el bucket o si algún pgTAP de Storage se saltea
  # (`EXIGIR_STORAGE=1`), para que un cambio que rompa el bucket o las políticas de `storage.objects`
  # no pase en verde. Pasos y variables: docs/mapas-tiles.md § «Probar contra un Storage real».
  storage:
    name: bucket mapas · Storage real (0029 y pgTAP 0036)
    needs: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # La base, storage-api, PostgREST y node salen de la caché que dejó el job `imagenes`; si falta, se
      # bajan por digest de ghcr.io y, si ghcr.io no contesta, de sus espejos (scripts/ci-imagenes.txt).
      # correr.sh pide las mismas imágenes y las encuentra ya en Docker.
      - name: Imágenes de la base (caché)
        uses: ./.github/actions/imagenes
        with:
          grupo: base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Imágenes de Storage (caché)
        uses: ./.github/actions/imagenes
        with:
          grupo: storage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # correr.sh no construye imágenes: usa la `backend-supabase-dev:latest` de compose.dev.yml.
      - name: Construir tooling
        run: docker compose -f compose.dev.yml build cli

      - name: Migraciones y pgTAP 0036 contra un storage-api real
        run: SOLO_BASE=1 bash tiles/prueba-storage/correr.sh

      # correr.sh ya apaga todo al salir; esto cubre que el job se corte antes.
      - name: Apagar
        if: always()
        run: |
          docker rm -f tiles-storage-storage tiles-storage-rest tiles-storage-gateway || true
          docker compose -p tiles-storage -f compose.dev.yml down -v --remove-orphans

  migraciones:
    name: migraciones desde cero · pgTAP
    needs: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Antes de levantar nada: si hay SQL fuera de supabase/, los pasos de abajo
      # no lo aplican y el job daría verde sobre código que nadie ejecutó.
      # No necesita Docker — es git y grep.
      - name: SQL solo en supabase/
        run: bash scripts/check-sql-layout.sh

      # El servidor exige al menos la contraseña mínima de la app (8). Tampoco necesita Docker.
      - name: Contraseña mínima del servidor
        run: bash scripts/check-config.sh

      # La imagen de la DB sale de la caché que dejó el job `imagenes`; si falta, se baja por digest de
      # ghcr.io y, si ghcr.io no contesta (`toomanyrequests`: límite global por IP, aun con login, en
      # ráfagas), de ECR Public y de Docker Hub, que tienen el mismo digest (scripts/ci-imagenes.txt).
      - name: Imágenes de la base (caché)
        uses: ./.github/actions/imagenes
        with:
          grupo: base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mismo entorno que el desarrollo local (compose.dev.yml): Postgres de Supabase + CLI + pg_prove.
      - name: Construir tooling
        run: docker compose -f compose.dev.yml build cli

      - name: Aplicar migraciones sobre una base vacía
        run: docker compose -f compose.dev.yml run --rm cli bash scripts/db-migrate.sh

      - name: Tests pgTAP (esquema, privacidad, RLS)
        run: docker compose -f compose.dev.yml run --rm cli bash scripts/db-test.sh

      - name: Lint de funciones (plpgsql_check)
        run: docker compose -f compose.dev.yml run --rm cli bash scripts/db-lint.sh

      # Las migraciones que mueven datos, con datos: la base de arriba está vacía, así que ahí
      # una migración de datos no mueve nada. Va al final porque limpia y rearma la base.
      - name: Migraciones con datos (tests_migracion)
        run: docker compose -f compose.dev.yml run --rm cli bash scripts/db-test-migracion.sh

      - name: Apagar
        if: always()
        run: docker compose -f compose.dev.yml down -v --remove-orphans
