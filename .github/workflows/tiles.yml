name: Mapas

# Publica los mapas propios (PMTiles de OpenStreetMap, estilo y catálogo) en el bucket público
# `mapas` del proyecto Supabase del environment. Explicación completa: docs/mapas-tiles.md.
#
# Se dispara a mano para lo que cambia cuando alguien lo decide (una ciudad nueva, una paleta nueva, un
# build más reciente de Protomaps), no con cada merge. Re-cortar cada vez que Protomaps publica un build
# (a diario) le haría bajar a cada teléfono ~11 MB de mapa idéntico.
#
# Y corre solo, cada hora, para los paquetes de las ZONAS (backend-supabase#42, etapa 2): una zona nueva o
# movida tiene su mapa publicado en la hora siguiente, sin que nadie lo pida. Esa corrida programada hace
# `publicar --solo zonas` y solo en los environments cuya variable de repo está en `true`:
#   MAPAS_ZONAS_DEVELOP, MAPAS_ZONAS_STAGING, MAPAS_ZONAS_PRODUCTION   (Settings → Variables → Actions)
# Sin la variable, esa corrida no publica en ese environment (como DEPLOY_DEVELOP en deploy.yml). Un
# `schedule` solo corre desde la rama por defecto (`production`).
#
# NO necesita secretos nuevos. Usa los del environment de deploy.yml:
#   SUPABASE_PROJECT_ID    → de ahí sale la URL del proyecto (https://<id>.supabase.co);
#   SUPABASE_ACCESS_TOKEN  → con él el CLI pide la clave de servicio, que no se guarda en ningún lado.
# Si el environment tiene además SUPABASE_SERVICE_ROLE_KEY (o SUPABASE_URL, por si el proyecto
# tiene dominio propio), se usan esos y no se llama a la API.
#
# Como cualquier workflow_dispatch, para que aparezca en Actions tiene que existir en la rama por
# defecto (`production`); mientras tanto, la misma publicación corre desde una máquina: ver
# docs/mapas-tiles.md § «Publicar a mano».
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment cuyo bucket `mapas` se publica
        required: true
        type: choice
        options: [develop, staging, production]
      solo:
        description: Qué publicar
        required: true
        type: choice
        default: todo
        options: [todo, estilo, ciudades, zonas]
      ciudad:
        description: Solo esta ciudad (su nombre en minúsculas, sin tildes y con guiones, p. ej. montevideo). Vacío = todas las que tienen rectángulo en public.ciudad
        required: false
        type: string
      zona:
        description: Solo esta zona (su id en public.zona). Vacío = todas
        required: false
        type: string
      regenerar:
        description: Volver a cortar las zonas aunque su polígono no haya cambiado
        required: false
        type: boolean
        default: false
      build:
        description: Build de Protomaps (AAAAMMDD). Vacío = el más reciente
        required: false
        type: string
      simulacro:
        description: Hacer todo menos escribir en el bucket
        required: false
        type: boolean
        default: false

jobs:
  # A qué environments se publica: el que se eligió a mano o, en la corrida programada, los que tienen su
  # variable `MAPAS_ZONAS_<ENVIRONMENT>` en `true`.
  elegir:
    name: elegir environments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      environments: ${{ steps.lista.outputs.environments }}
    steps:
      - id: lista
        env:
          DISPARO: ${{ github.event_name }}
          ELEGIDO: ${{ inputs.environment }}
          MAPAS_ZONAS_DEVELOP: ${{ vars.MAPAS_ZONAS_DEVELOP }}
          MAPAS_ZONAS_STAGING: ${{ vars.MAPAS_ZONAS_STAGING }}
          MAPAS_ZONAS_PRODUCTION: ${{ vars.MAPAS_ZONAS_PRODUCTION }}
        run: |
          set -euo pipefail
          elegidos=()
          if [ "$DISPARO" = "workflow_dispatch" ]; then
            elegidos+=("$ELEGIDO")
          else
            if [ "${MAPAS_ZONAS_DEVELOP:-}" = "true" ]; then elegidos+=(develop); fi
            if [ "${MAPAS_ZONAS_STAGING:-}" = "true" ]; then elegidos+=(staging); fi
            if [ "${MAPAS_ZONAS_PRODUCTION:-}" = "true" ]; then elegidos+=(production); fi
          fi
          lista="$(printf '%s\n' "${elegidos[@]:-}" | jq -R . | jq -sc 'map(select(. != ""))')"
          echo "environments=$lista" >> "$GITHUB_OUTPUT"
          echo "Se publica en: $lista"

  publicar:
    name: publicar mapas (${{ matrix.environment }})
    needs: elegir
    if: ${{ needs.elegir.outputs.environments != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.elegir.outputs.environments) }}
    # Un solo publicador por environment a la vez: todos leen y reescriben el mismo catalogo.json y las
    # mismas zonas. Una corrida programada que llega con otra en curso espera su turno.
    concurrency:
      group: tiles-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tiles
    # Sin `env:` a nivel de job a propósito: los secretos llegan solo al paso «Publicar», que es el único
    # que los usa. `npm ci` y `npm test` ejecutan el código de las dependencias y no los necesitan.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiles/package-lock.json

      - run: npm ci

      # Las pruebas primero: si el publicador está roto, no se toca el bucket.
      - run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Los secretos del environment entran solo acá. La clave de servicio (que, si no está como secreto, se
      # le pide al CLI de Supabase) vive únicamente en este paso, como variable de shell: no se escribe en
      # GITHUB_ENV, así que ningún paso posterior (ni sus dependencias) la ve.
      - name: Publicar
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # La corrida programada no tiene inputs: publica solo las zonas.
          SOLO: ${{ inputs.solo || 'zonas' }}
          CIUDAD: ${{ inputs.ciudad }}
          ZONA: ${{ inputs.zona }}
          REGENERAR: ${{ inputs.regenerar }}
          BUILD: ${{ inputs.build }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            test -n "${SUPABASE_PROJECT_ID:-}" || { echo "::error::Falta SUPABASE_PROJECT_ID (o SUPABASE_URL) en el environment"; exit 1; }
            export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            key="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json \
              | jq -r '[.[] | select(.name == "service_role" or .id == "service_role")][0].api_key // empty' || true)"
            test -n "$key" || { echo "::error::No pude obtener la clave de servicio con SUPABASE_ACCESS_TOKEN"; exit 1; }
            echo "::add-mask::$key"
            export SUPABASE_SERVICE_ROLE_KEY="$key"
          fi
          # Lo único que sigue: la dirección del proyecto (no es secreta), para el paso de verificación.
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"

          args=(publicar)
          if [ "$SOLO" != "todo" ]; then args+=(--solo "$SOLO"); fi
          if [ -n "$CIUDAD" ]; then args+=(--ciudad "$CIUDAD"); fi
          if [ -n "$ZONA" ]; then args+=(--zona "$ZONA"); fi
          if [ "$REGENERAR" = "true" ]; then args+=(--regenerar); fi
          if [ -n "$BUILD" ]; then args+=(--build "$BUILD"); fi
          if [ "$SIMULACRO" = "true" ]; then args+=(--dry-run); fi
          node src/cli.mjs "${args[@]}"

      # Lo que importa del bucket: se lee sin login, con CORS para localhost y GitHub Pages, y con Range.
      # Solo necesita la dirección del proyecto (SUPABASE_URL, que dejó el paso anterior), ningún secreto.
      - name: Verificar el bucket publicado
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.simulacro }}
        run: node src/cli.mjs verificar
